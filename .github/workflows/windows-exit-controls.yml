name: Bounded Windows Qt exit source controls

on:
  push:
    branches:
      - diagnostics/onefile-owned-exit-20261012
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-exit-controls-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-source-controls:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5 revision
        with:
          python-version: '3.11.9'
          architecture: x64
          cache: ''
      - name: Reject private files and credential markers
        run: python -m build_tools.check_repository_hygiene
      - name: Create a separate environment with the existing official hash pins
        run: |
          python -m venv .venv-contrast
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv-contrast\Scripts\python.exe -m pip install --only-binary=:all: --require-hashes -r requirements-release-hashed.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv-contrast\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record the exact diagnostic source and environment
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tree = git rev-parse 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @{
            source_commit = $commit
            source_tree = $tree
            helper_sha256 = (Get-FileHash build_tools/qt_exit_contrast.py -Algorithm SHA256).Hash.ToLowerInvariant()
            runtime_pins_sha256 = (Get-FileHash requirements-release-hashed.txt -Algorithm SHA256).Hash.ToLowerInvariant()
            scope = 'Five source-process controls on a hosted Windows runner; not frozen EXE or clean-OS acceptance.'
          } | ConvertTo-Json | Out-File -Encoding utf8 artifacts/source-provenance.json
          .\.venv-contrast\Scripts\python.exe -m pip freeze --all | Out-File -Encoding utf8 artifacts/environment.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run all five isolated native Qt controls and preserve mismatches
        run: |
          .\.venv-contrast\Scripts\python.exe -m build_tools.qt_exit_contrast --python .venv-contrast\Scripts\python.exe --output artifacts/native-exit-controls
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload only the synthetic control receipts and raw streams
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-exit-controls-${{ github.sha }}
          path: |
            artifacts/source-provenance.json
            artifacts/environment.txt
            artifacts/native-exit-controls/contrast.json
            artifacts/native-exit-controls/*/child.json
            artifacts/native-exit-controls/*/process.json
            artifacts/native-exit-controls/*/stdout.bin
            artifacts/native-exit-controls/*/stderr.bin
            artifacts/native-exit-controls/*/forced-cleanup.json
          if-no-files-found: error
          retention-days: 7
