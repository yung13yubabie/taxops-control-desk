name: Bounded Windows Shell module observation

on:
  push:
    branches:
      - diagnostics/windows-shell-origin-20261012
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-shell-origin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  shell-origin-observation:
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5 revision
        with:
          python-version: '3.11.9'
          architecture: x64
          cache: ''
      - name: Reject private files and credential markers
        run: python -m build_tools.check_repository_hygiene
      - name: Record the fixed source and runner image
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tree = git rev-parse 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @{
            source_commit = $commit
            source_tree = $tree
            image_os = $env:ImageOS
            image_version = $env:ImageVersion
            helper_sha256 = (Get-FileHash build_tools/shell_icon_probe.py -Algorithm SHA256).Hash.ToLowerInvariant()
            scope = 'Independent synthetic Windows Shell observation. No Qt or TaxOps import. No module-origin gate exception or clean-OS acceptance.'
          } | ConvertTo-Json | Out-File -Encoding utf8 artifacts/shell-source-provenance.json
      - name: Observe only the owned child before and after synthetic Shell queries
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'shell-icon-observation'
          python -m build_tools.shell_icon_probe --output $output --timeout 90
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload only synthetic receipts and raw streams
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-shell-origin-${{ github.sha }}
          path: |
            artifacts/shell-source-provenance.json
            ${{ runner.temp }}/shell-icon-observation/report.json
            ${{ runner.temp }}/shell-icon-observation/child.json
            ${{ runner.temp }}/shell-icon-observation/stdout.bin
            ${{ runner.temp }}/shell-icon-observation/stderr.bin
            ${{ runner.temp }}/shell-icon-observation/owned-cleanup.json
          if-no-files-found: error
          retention-days: 7
