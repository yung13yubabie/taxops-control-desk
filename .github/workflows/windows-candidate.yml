name: Windows candidate build and frozen smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-candidate:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5 revision
        with:
          python-version: '3.11.9'
          architecture: x64
          cache: ''
      - name: Reject private files and credential markers in the tracked tree
        run: python -m build_tools.check_repository_hygiene
      - name: Create separate pinned test and release environments
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          python -m venv .venv-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv-test\Scripts\python.exe -m pip install --only-binary=:all: -r requirements-release.txt -r requirements-ci.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv-test\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m venv .venv-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv-release\Scripts\python.exe -m pip install --only-binary=:all: --require-hashes -r requirements-release-hashed.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv-release\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv-release\Scripts\python.exe -m pip freeze --all | Out-File -Encoding utf8 artifacts\release-environment.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Isolated per-file regression and combined raw branch coverage
        run: |
          .\.venv-test\Scripts\python.exe -m build_tools.run_test_matrix --output artifacts\source-tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage the fixed official Microsoft component and build the single EXE
        run: |
          $source = Get-Content build_tools/vc_redist_source.json -Raw | ConvertFrom-Json
          $payload = $source.package.payloads[0]
          $vsix = Join-Path $env:RUNNER_TEMP "TaxOps-Microsoft.VC.fixed.vsix"
          Invoke-WebRequest -Uri $payload.url -OutFile $vsix
          if ((Get-FileHash -Algorithm SHA256 $vsix).Hash.ToLowerInvariant() -ne $payload.sha256) { throw "Official Microsoft VSIX hash mismatch" }
          $env:TAXOPS_VC_REDIST_VSIX = $vsix
          .\.venv-release\Scripts\python.exe -m build_tools.package_windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test the exact single EXE payload and normal bootloader lifecycle
        run: |
          .\.venv-release\Scripts\python.exe -m build_tools.verify_onefile --output artifacts\windows-onefile --source-matrix artifacts\source-tests\matrix.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Export matching Application Code recombination materials
        run: |
          .\.venv-release\Scripts\python.exe -m build_tools.make_recombine_kit --exe artifacts\windows-onefile\TaxOpsControlDesk.exe --provenance artifacts\windows-onefile\onefile-provenance.json --output artifacts\TaxOpsControlDesk-recombine-kit.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record acceptance boundary
        if: always()
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          @'
          This is a hosted Windows runner, not a clean offline end-user computer.
          The frozen synthetic self-test uses isolated data and rejects CPython
          socket operations. It is not an OS-level network sandbox. No live APIs
          are called by the synthetic flows. Manual workflows, DPI, clean-OS
          acceptance, real-data upgrade, and publisher signing are NOT verified.
          This workflow uploads candidate artifacts only; it never publishes a Release.
          '@ | Out-File -Encoding utf8 artifacts\ACCEPTANCE-BOUNDARY.txt
      - name: Upload candidate and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-candidate-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  windows-ui-diagnostics:
    # A parallel, synthetic diagnosis only. This never replaces the complete
    # source/coverage/build gate above and never creates an application bundle.
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONUTF8: '1'
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
      TAXOPS_UI_DIAGNOSTICS_DIR: artifacts/windows-ui-diagnostics
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5 revision
        with:
          python-version: '3.11.9'
          architecture: x64
          cache: ''
      - name: Reject private files and credential markers in the tracked tree
        run: python -m build_tools.check_repository_hygiene
      - name: Install the same pinned test dependencies
        run: |
          New-Item -ItemType Directory -Force $env:TAXOPS_UI_DIAGNOSTICS_DIR | Out-Null
          @{
            event_head_sha = '${{ github.event.pull_request.head.sha }}'
            checkout_sha = (git rev-parse HEAD)
            checkout_tree = (git rev-parse 'HEAD^{tree}')
            scope = 'Seven complete synthetic UI/diagnostic test files and separate native glyph probe; not the release gate'
          } | ConvertTo-Json | Out-File -Encoding utf8 "$env:TAXOPS_UI_DIAGNOSTICS_DIR/provenance.json"
          python -m venv .venv-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv-test\Scripts\python.exe -m pip install --only-binary=:all: -r requirements-release.txt -r requirements-ci.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv-test\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preflight packaging inputs in the diagnostic environment
        if: always()
        run: |
          @{
            scope = 'Same packaging input implementation in pinned test venv; not a release build or artifact acceptance'
            packaging_and_native_acceptance = 'not performed by this diagnostic step'
          } | ConvertTo-Json | Out-File -Encoding utf8 "$env:TAXOPS_UI_DIAGNOSTICS_DIR/package-input-boundary.json"
          .\.venv-test\Scripts\python.exe -m build_tools.windows_package_environment --output "$env:TAXOPS_UI_DIAGNOSTICS_DIR/package-environment.json" --probe-qt-translation *> "$env:TAXOPS_UI_DIAGNOSTICS_DIR/package-input-process.log"
          $code = $LASTEXITCODE
          Get-Content "$env:TAXOPS_UI_DIAGNOSTICS_DIR/package-input-process.log"
          if ($code -ne 0) { exit $code }
      - name: Run each complete diagnostic file and retain every failure
        run: |
          $files = @('test_native_font_probe', 'test_qt_geometry_diagnostics', 'test_deep_chinese_ui', 'test_frozen_self_test', 'test_novice_client_forms', 'test_ui_stage_5_date_field', 'test_v032_receipt_workbench')
          $results = @()
          $failed = $false
          foreach ($file in $files) {
            .\.venv-test\Scripts\python.exe -m pytest -q "tests/$file.py" "--junitxml=$env:TAXOPS_UI_DIAGNOSTICS_DIR/$file.xml" *> "$env:TAXOPS_UI_DIAGNOSTICS_DIR/$file.log"
            $code = $LASTEXITCODE
            $results += @{ file = "tests/$file.py"; exit_code = $code }
            $results | ConvertTo-Json | Out-File -Encoding utf8 "$env:TAXOPS_UI_DIAGNOSTICS_DIR/results.json"
            Get-Content "$env:TAXOPS_UI_DIAGNOSTICS_DIR/$file.log"
            if ($code -ne 0) { $failed = $true }
          }
          $results | ConvertTo-Json | Out-File -Encoding utf8 "$env:TAXOPS_UI_DIAGNOSTICS_DIR/results.json"
          if ($failed) { exit 1 }
      - name: Inspect native Windows font rendering separately
        if: always()
        run: |
          .\.venv-test\Scripts\python.exe -m build_tools.native_font_probe --output-dir "$env:TAXOPS_UI_DIAGNOSTICS_DIR/native-font"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Diagnose the same fixed Microsoft signature stage separately
        if: always()
        run: |
          $source = Get-Content build_tools/vc_redist_source.json -Raw | ConvertFrom-Json
          $payload = $source.package.payloads[0]
          $directory = "$env:TAXOPS_UI_DIAGNOSTICS_DIR/signature"
          New-Item -ItemType Directory -Force $directory | Out-Null
          @{
            status = 'failed'
            stage = 'download'
            package_url = $payload.url
            expected_sha256 = $payload.sha256
            expected_bytes = $source.observed_package_bytes
            scope = 'signature-only diagnostic; not application acceptance'
          } | ConvertTo-Json | Out-File -Encoding utf8 "$directory/official-vc.json"
          $vsix = Join-Path $env:RUNNER_TEMP "TaxOps-Microsoft.VC.diagnostic.vsix"
          try {
            Invoke-WebRequest -Uri $payload.url -OutFile $vsix
            python -m build_tools.official_vc_runtime --signature-only --archive "$vsix" --receipt "$directory/official-vc.json" *> "$directory/process.log"
            $code = $LASTEXITCODE
            Get-Content "$directory/process.log"
            if ($code -ne 0) { exit $code }
          } catch {
            $_ | Out-File -Append -Encoding utf8 "$directory/process.log"
            throw
          }
      - name: Upload synthetic UI diagnostics even when assertions fail
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-ui-diagnostics-${{ github.sha }}
          path: artifacts/windows-ui-diagnostics/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
