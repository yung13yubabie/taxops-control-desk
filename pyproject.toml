[project]
name = "taxops-control-desk"
version = "0.31.0"
description = "Offline-first desktop operations workbench for Taiwan accounting and tax offices."
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7,<6.11",
  "Jinja2>=3.1,<4.0",
  "openpyxl>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-qt>=4.5,<5.0",
  "pytest-cov>=7.0,<8.0",
  "pyinstaller>=6.3,<7.0",
  "ruff==0.15.15",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["taxops"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
